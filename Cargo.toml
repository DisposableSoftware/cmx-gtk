[package]
name = "cmx"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[[bin]]
name = "cmx"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["gnome_49"] }
quick-xml = "0.42.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
