# $XDG_CONFIG_HOME/cmx/config.ini  (usually ~/.config/cmx/config.ini)
# Every key is optional. Restart cmx to apply changes. Keybindings live in keybindings.ini.

[window]
# Starting size of new windows in logical px (width 300 – 8192, height 200 – 8192).
# A comic that opens then fits the window to its page.
width = 800
height = 1000

[appearance]
# latte | frappe | macchiato | mocha, or gtk to use the GTK theme's colours and accent
flavor = mocha
# rosewater flamingo pink mauve red maroon peach yellow green teal sky sapphire blue lavender
# (ignored with flavor = gtk)
accent = mauve
# Window background alpha, 0.0 – 1.0. The page area stays black.
opacity = 0.85
