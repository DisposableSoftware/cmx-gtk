# $XDG_CONFIG_HOME/cmx/config.ini  (usually ~/.config/cmx/config.ini)
# Every key is optional. Restart cmx to apply changes. Keybindings live in keybindings.ini.

[window]
# Starting size of new windows in logical px (width 300 – 8192, height 200 – 8192).
# A comic that opens then fits the window to its page.
width = 800
height = 1000
