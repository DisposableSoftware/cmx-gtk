# $XDG_CONFIG_HOME/cmx/keybindings.ini  (usually ~/.config/cmx/keybindings.ini)
# Every binding is optional: one left out keeps its default keys. Restart cmx to apply changes.

[keybindings]
# GTK accelerator syntax: <Ctrl> <Shift> <Alt> <Super> + key name (see `wev` or GDK key names).
# Separate several bindings with ';'. Leave a value empty to unbind. Defaults shown.
new-window = <Ctrl>n
close-window = <Ctrl>w
quit = <Ctrl>q
